<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Lee Lionel — Software Engineer</title>
    <meta
      name="description"
      content="Lee Lionel — software engineer in Singapore. Full-stack work in TypeScript, React, Node and Prisma, with the projects, the screenshots and the résumé behind them."
    />
    <meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1112" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lee Lionel — Software Engineer" />
    <meta
      property="og:description"
      content="Lee Lionel — software engineer in Singapore. Full-stack work in TypeScript, React, Node and Prisma, with the projects, the screenshots and the résumé behind them."
    />

    <!-- Stamps the saved appearance before first paint, so there's no flash. -->
    <script>
      try {
        var t = localStorage.getItem('portfolio-theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <!--
      A résumé you can read. The work leads: real screenshots at size, each
      with the set of states the app actually has. Two typefaces for the two
      kinds of writing a résumé is — Newsreader for the narrative, JetBrains
      Mono for the record. Colour only ever encodes a technology's category,
      so a splash of teal always means "framework" and never decoration.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
